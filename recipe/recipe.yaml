schema_version: 1

context:
  version: "2.2.4"

package:
  name: ttkbootstrap
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/ttkbootstrap/ttkbootstrap-${{ version }}.tar.gz
  sha256: 3b45b6599a232e9392f56b25ea5304a4fc41ffcd3516d63cbcdd94601e87aa92

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - ttkbootstrap = ttkbootstrap.cli:main
      - ttkb = ttkbootstrap.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=61
    - pip
  run:
    - python >=${{ python_min }}
    - pillow >=10,<14

tests:
  # conda-forge's tk links libX11 without depending on xorg-libx11, so it
  # must be provided explicitly for tkinter to import on Linux.
  # c.f. https://github.com/conda-forge/tk-feedstock/issues/79
  # The python test type does not support extra requirements, so use script
  # tests for the imports.
  - requirements:
      run:
        - python ${{ python_min }}.*
        - pip
        - if: linux
          then: xorg-libx11
    script:
      - python -c "import ttkbootstrap, ttkcreator"
      - pip check
      - ttkbootstrap --help
      - ttkb --help

  - requirements:
      run:
        - python
        - if: linux
          then: xorg-libx11
    script:
      - python -c "import ttkbootstrap, ttkcreator"

about:
  summary: Modern themes for Tkinter.
  description: |
    Sleek, responsive styles inspired by Bootstrap.
    Includes ready-to-use widgets, 30+ themes, and tools for building
    beautiful, cross-platform desktop apps with ease.
  license: MIT
  license_file:
    - LICENSE
    - src/ttkbootstrap/assets/icons/LICENSE
  homepage: https://github.com/israel-dryer/ttkbootstrap
  repository: https://github.com/israel-dryer/ttkbootstrap
  documentation: https://www.ttkbootstrap.org/

extra:
  recipe-maintainers:
    - matthewfeickert
    - israel-dryer
